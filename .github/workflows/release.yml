name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version or tag, for example v1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}'
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Release version is required.'
          }

          $assetVersion = $version -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_version=$assetVersion" >> $env:GITHUB_OUTPUT

      - name: Parse-check PowerShell scripts
        shell: powershell
        run: |
          $parseFailed = $false
          $files = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Recurse -Filter '*.ps1' -File |
            Where-Object { $_.FullName -notlike '*\.git\*' -and $_.FullName -notlike '*\dist\*' }

          foreach ($file in $files) {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -LiteralPath $file.FullName -Raw), [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $parseFailed = $true
              Write-Error "Parse errors in $($file.FullName)"
              $errors | Format-List | Out-String | Write-Host
            }
          }

          if ($parseFailed) {
            exit 1
          }

      - name: Package release asset
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.asset_version }}'
          $packageName = "win-clean-$version"
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $packageRoot = Join-Path $distRoot $packageName
          $zipPath = Join-Path $distRoot "$packageName.zip"
          $checksumPath = Join-Path $distRoot "$packageName.zip.sha256"

          if (Test-Path -LiteralPath $distRoot) {
            Remove-Item -LiteralPath $distRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'win-clean-gui.ps1') -Destination $packageRoot
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'src') -Destination $packageRoot -Recurse

          $agentGuide = Join-Path $env:GITHUB_WORKSPACE 'AGENTS.md'
          if (Test-Path -LiteralPath $agentGuide) {
            Copy-Item -LiteralPath $agentGuide -Destination $packageRoot
          }

          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $zipPath)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-clean-${{ steps.version.outputs.asset_version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Win Clean ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}